name: Bug report
description: Something in the Claude setup behaves incorrectly.
title: "[Bug] "
labels: ["intake:bug", "triage"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Redact secrets and private data.
      render: shell
  - type: input
    id: version
    attributes:
      label: Claude Code version and model
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Settings
        - Hooks
        - Skills
        - Agents
        - MCP
        - Permissions
        - CLAUDE.md / AGENTS.md
        - Other
    validations:
      required: true
  - type: dropdown
    id: implementation_model
    attributes:
      label: Suggested implementation model
      description: Sonnet for simple, well-scoped changes. Opus for complex design or cross-cutting work.
      options:
        - Sonnet
        - Opus
        - Unsure
  - type: dropdown
    id: source
    attributes:
      label: Source
      description: Who raised this.
      options:
        - Manual
        - Session analysis (automated)
    validations:
      required: true
  - type: input
    id: sessions
    attributes:
      label: Session IDs
      description: Sessions where this was observed, comma separated.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Transcript quotes that justify this. Redact secrets and private data.
