name: Automation opportunity
description: Repeated or steered behavior that could become deterministic.
title: "[Automation] "
labels: ["intake:automation", "triage"]
body:
  - type: textarea
    id: pattern
    attributes:
      label: Repeated pattern
      description: The manual steps, commands or corrections that keep recurring.
    validations:
      required: true
  - type: input
    id: frequency
    attributes:
      label: Frequency
      description: How often it was observed, e.g. 4 sessions in 2 weeks.
  - type: dropdown
    id: mechanism
    attributes:
      label: Proposed mechanism
      options:
        - Script
        - Hook
        - Skill
        - MCP tool
        - Permission rule
        - CLAUDE.md / AGENTS.md rule
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Settings
        - Hooks
        - Skills
        - Agents
        - MCP
        - Permissions
        - CLAUDE.md / AGENTS.md
        - Other
    validations:
      required: true
  - type: dropdown
    id: implementation_model
    attributes:
      label: Suggested implementation model
      description: Sonnet for simple, well-scoped changes. Opus for complex design or cross-cutting work.
      options:
        - Sonnet
        - Opus
        - Unsure
  - type: dropdown
    id: source
    attributes:
      label: Source
      description: Who raised this.
      options:
        - Manual
        - Session analysis (automated)
    validations:
      required: true
  - type: input
    id: sessions
    attributes:
      label: Session IDs
      description: Sessions where this was observed, comma separated.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Transcript quotes that justify this. Redact secrets and private data.
